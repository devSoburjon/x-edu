<script>
/* =========================================================
   X-edu — demo ta'lim platformasi (single-file)
   ========================================================= */

/* ---------- MA'LUMOTLAR (DATA) ---------- */
const SUBJECTS = ["Matematika","Ona tili","Adabiyot","Ingliz tili","Rus tili","Fizika","Kimyo","Biologiya","Tarix","Geografiya","Informatika"];

const MATERIAL_TYPES = ["Test","Ish varaqasi","Nazorat ishi","Krossvord","Anagramma","Savol-javob","Bo'sh joyni to'ldirish","Moslashtirish","BSB","ChSB"];
const LEVELS = ["Oson","O'rta","Qiyin"];
const QCOUNTS = [5,10,15,20,30];

const TOPICS = {
  "Matematika": ["Kasrlar","Tenglamalar","Geometrik shakllar","Foizlar","Funksiyalar","Ko'phadlar","Trigonometriya asoslari"],
  "Ona tili": ["Gap bo'laklari","Otlar va sifatlar","Fe'l zamonlari","Sintaksis","Imlo qoidalari"],
  "Adabiyot": ["Alisher Navoiy ijodi","Xalq og'zaki ijodi","Zamonaviy o'zbek nasri","She'riy vazn"],
  "Ingliz tili": ["Present Simple","Past Tenses","Modal verbs","So'z boyligi: Travel","Reading comprehension"],
  "Rus tili": ["Падежи","Глаголы движения","Части речи"],
  "Fizika": ["Nyuton qonunlari","Elektr toki","Energiya saqlanishi","Optika asoslari"],
  "Kimyo": ["Davriy sistema","Kimyoviy bog'lanishlar","Eritmalar","Oksidlanish-qaytarilish"],
  "Biologiya": ["Hujayra tuzilishi","Fotosintez","Genetika asoslari","Ekosistemalar"],
  "Tarix": ["Amir Temur davri","Ikkinchi jahon urushi","Mustaqillik tarixi","Qadimgi Sharq"],
  "Geografiya": ["Iqlim mintaqalari","O'zbekiston tabiiy resurslari","Materiklar","Aholi geografiyasi"],
  "Informatika": ["Algoritmlar asoslari","Ma'lumotlar bazasi","Python asoslari","Tarmoqlar"]
};

function seedRand(seed){ let x = Math.sin(seed) * 10000; return x - Math.floor(x); }

/* =========================================================
   BILIM GRAFI — X-Edu yadrosi
   Har bir tushuncha o'zidan oldin kelishi shart bo'lgan
   tushunchalarga bog'langan. Xato sababini topish shu grafga tayanadi.
   ========================================================= */
const CONCEPTS = {
  manfiy:   { nom:"Manfiy sonlar",        oldin:[] },
  daraja:   { nom:"Daraja va kvadrat",    oldin:['manfiy'] },
  ildiz:    { nom:"Kvadrat ildiz",        oldin:['daraja'] },
  qavs:     { nom:"Qavslarni ochish",     oldin:['manfiy'] },
  chiziqli: { nom:"Chiziqli tenglama",    oldin:['qavs'] },
  kvadrat:  { nom:"Kvadrat tenglama",     oldin:['ildiz','chiziqli'] }
};

/* Har bir savol aniq bitta tushunchaga bog'langan —
   xato tahlili shunisiz umuman ishlamaydi. */
const QUESTIONS = [
  { id:'q1', concept:'manfiy', savol:"(−5) + 3 amalning natijasi nimaga teng?",
    variantlar:["−2","2","−8","8"], javob:"−2",
    izoh:"Ishoralari har xil sonlarni qo'shganda moduli katta sondan kichigi ayiriladi va katta sonning ishorasi qo'yiladi: 5 − 3 = 2, ishora manfiy → −2." },
  { id:'q2', concept:'manfiy', savol:"(−4) · (−3) amalning natijasi nimaga teng?",
    variantlar:["12","−12","−7","7"], javob:"12",
    izoh:"Ikki manfiy sonning ko'paytmasi musbat bo'ladi: 4 · 3 = 12." },

  { id:'q3', concept:'daraja', savol:"(−3)² nimaga teng?",
    variantlar:["9","−9","6","−6"], javob:"9",
    izoh:"Qavs ichidagi manfiy son kvadratga ko'tarilsa natija musbat: (−3)·(−3) = 9. Diqqat: −3² esa −9 bo'ladi." },
  { id:'q4', concept:'daraja', savol:"2³ · 2² ifodani soddalashtiring.",
    variantlar:["2⁵","2⁶","4⁵","2¹"], javob:"2⁵",
    izoh:"Asoslari bir xil darajalar ko'paytirilsa ko'rsatkichlar qo'shiladi: 3 + 2 = 5." },

  { id:'q5', concept:'ildiz', savol:"√49 nimaga teng?",
    variantlar:["7","9","24,5","2401"], javob:"7",
    izoh:"Kvadrat ildiz — kvadratga ko'tarishning teskarisi. 7² = 49 bo'lgani uchun √49 = 7." },
  { id:'q6', concept:'ildiz', savol:"√(16 · 9) nimaga teng?",
    variantlar:["12","25","7","144"], javob:"12",
    izoh:"Ko'paytmadan ildiz: √16 · √9 = 4 · 3 = 12." },

  { id:'q7', concept:'qavs', savol:"2(x + 3) ifodani qavssiz yozing.",
    variantlar:["2x + 6","2x + 3","x + 6","2x + 5"], javob:"2x + 6",
    izoh:"Qavs oldidagi ko'paytuvchi har bir qo'shiluvchiga ko'paytiriladi: 2·x + 2·3." },
  { id:'q8', concept:'qavs', savol:"−(x − 5) ifodani qavssiz yozing.",
    variantlar:["−x + 5","−x − 5","x − 5","x + 5"], javob:"−x + 5",
    izoh:"Qavs oldida minus turса, ichidagi har bir hadning ishorasi almashadi." },

  { id:'q9', concept:'chiziqli', savol:"3x − 6 = 0 tenglamani yeching.",
    variantlar:["x = 2","x = −2","x = 6","x = 18"], javob:"x = 2",
    izoh:"3x = 6 → x = 6 : 3 = 2." },
  { id:'q10', concept:'chiziqli', savol:"2x + 4 = 10 tenglamani yeching.",
    variantlar:["x = 3","x = 7","x = 5","x = 6"], javob:"x = 3",
    izoh:"2x = 10 − 4 = 6 → x = 3." },

  { id:'q11', concept:'kvadrat', savol:"x² − 5x + 6 = 0 tenglamaning ildizlarini toping.",
    variantlar:["x = 2; x = 3","x = −2; x = −3","x = 1; x = 6","x = 5; x = 6"], javob:"x = 2; x = 3",
    izoh:"D = 25 − 24 = 1, √D = 1. x = (5 ± 1)/2 → x = 3 va x = 2." },
  { id:'q12', concept:'kvadrat', savol:"x² + 2x + 5 = 0 tenglama nechta haqiqiy ildizga ega?",
    variantlar:["Haqiqiy ildiz yo'q","Bitta","Ikkita","Cheksiz ko'p"], javob:"Haqiqiy ildiz yo'q",
    izoh:"D = 2² − 4·1·5 = 4 − 20 = −16. Diskriminant manfiy bo'lgani uchun haqiqiy ildiz yo'q. Bu yerda manfiy sonlar bilan amal qilish muhim." }
];

/* ---------- TESTLAR (mock ma'lumot) ---------- */
const TESTS = [
  { id:'t1', nom:"Sonlar va amallar", tavsif:"Manfiy sonlar, daraja va kvadrat ildiz bo'yicha asosiy bilimlar.",
    concepts:['manfiy','daraja','ildiz'], daraja:"Oson", vaqt:"~5 daqiqa" },
  { id:'t2', nom:"Tenglamalar", tavsif:"Qavslarni ochish, chiziqli va kvadrat tenglamalar.",
    concepts:['qavs','chiziqli','kvadrat'], daraja:"O'rta", vaqt:"~5 daqiqa" },
  { id:'t3', nom:"Chorak nazorati", tavsif:"Barcha mavzular bo'yicha nazorat ishi. Bog'liqlik tahlili shu testda eng aniq ishlaydi.",
    concepts:['manfiy','daraja','ildiz','qavs','chiziqli','kvadrat'], daraja:"Qiyin", vaqt:"~6 daqiqa",
    savollar:['q1','q2','q3','q5','q7','q9','q11','q12'] }
];
function testSavollari(t){
  return t.savollar
    ? t.savollar.map(id => QUESTIONS.find(q=>q.id===id)).filter(Boolean)
    : QUESTIONS.filter(q => t.concepts.includes(q.concept));
}

/* ---------- XATO TAHLILI ----------
   Faqat "xato" demaydi — sababini va ildizini topadi. */
function tahlilQil(javoblar){
  const perConcept = {};
  javoblar.forEach(a=>{
    const c = a.concept;
    if (!perConcept[c]) perConcept[c] = { jami:0, xato:0, tezXato:0 };
    perConcept[c].jami++;
    if (!a.togri){ perConcept[c].xato++; if (a.vaqt < 4000) perConcept[c].tezXato++; }
  });

  // Zanjirdagi chuqurlik: teng xato ulushida yuzaki (keyingi) mavzu asosiy deb olinadi,
  // keyin ildizga qarab orqaga yuriladi.
  const chuqurlik = (c, korilgan=new Set()) => {
    if (korilgan.has(c) || !CONCEPTS[c]) return 0;
    korilgan.add(c);
    const oldin = CONCEPTS[c].oldin || [];
    return oldin.length ? 1 + Math.max(...oldin.map(p=>chuqurlik(p, korilgan))) : 0;
  };

  const muammoli = Object.keys(perConcept)
    .filter(c => perConcept[c].xato > 0)
    .sort((a,b) => {
      const ra = perConcept[a].xato/perConcept[a].jami;
      const rb = perConcept[b].xato/perConcept[b].jami;
      if (rb !== ra) return rb - ra;
      return chuqurlik(b) - chuqurlik(a);
    });

  if (!muammoli.length) return { toliq:true, perConcept };

  const asosiy = muammoli[0];

  // Ildizni qidiramiz: butun zanjir bo'ylab orqaga yurib, xato bo'lgan
  // eng erta (eng sayoz) mavzuni topamiz — muammo aslida o'sha yerdan boshlangan.
  const ajdodlar = (c, acc=new Set()) => {
    (CONCEPTS[c] && CONCEPTS[c].oldin || []).forEach(p=>{
      if (!acc.has(p)){ acc.add(p); ajdodlar(p, acc); }
    });
    return acc;
  };
  const xatoAjdodlar = [...ajdodlar(asosiy)].filter(p => perConcept[p] && perConcept[p].xato > 0);
  const ildiz = xatoAjdodlar.length
    ? xatoAjdodlar.sort((a,b)=>chuqurlik(a)-chuqurlik(b))[0]
    : asosiy;

  const st = perConcept[asosiy];
  let sabab, sababIzoh;
  if (ildiz !== asosiy){
    sabab = "Oldingi mavzu o'zlashtirilmagan";
    sababIzoh = `"${CONCEPTS[asosiy].nom}" ni yechish uchun avval "${CONCEPTS[ildiz].nom}" kerak. Xato aslida o'sha yerdan boshlangan.`;
  } else if (st.xato === st.jami){
    sabab = "Mavzu tushunilmagan";
    sababIzoh = `"${CONCEPTS[asosiy].nom}" bo'yicha barcha savollarda xato qildingiz — mavzuni boshidan ko'rib chiqish kerak.`;
  } else if (st.tezXato > 0){
    sabab = "Shoshilinch javob";
    sababIzoh = `Javoblaringiz juda tez berilgan. Bilim bor, lekin savol oxirigacha o'qilmayapti.`;
  } else {
    sabab = "Qisman o'zlashtirilgan";
    sababIzoh = `"${CONCEPTS[asosiy].nom}" qisman tushunilgan — mashq qilish yetarli.`;
  }

  return { toliq:false, perConcept, asosiy, ildiz, sabab, sababIzoh,
           tavsiya: CONCEPTS[ildiz].nom, tavsiyaKey: ildiz };
}

/* ---------- AI USTOZ ---------- */
/* Kalit config.js dan olinadi — u git'ga tushmaydi (.gitignore).
   Kalit bo'lmasa ilova ishlashda davom etadi, faqat FALLBACK matnlariga o'tadi.
   Ishlab chiqarishda kalit umuman brauzerga chiqmaydi: so'rov proxy backend orqali yuboriladi. */
const CFG = (typeof window !== 'undefined' && window.XEDU_CONFIG) || {};
const AI_KEY = CFG.geminiKey || '';
const AI_MODEL = CFG.geminiModel || 'gemini-flash-lite-latest';
const AI_TIMEOUT = CFG.aiTimeout || 12000;   // shundan uzoq kutmaymiz — zaxira matnga o'tamiz
if (!AI_KEY) console.info('X-Edu: AI kaliti topilmadi — zaxira tushuntirishlar rejimida ishlayapti.');

/* Internet/API ishlamay qolsa demo to'xtamasligi uchun zaxira matnlar */
const FALLBACK = {
  manfiy: "Manfiy sonlarni sonlar o'qi orqali tasavvur qiling: noldan chapda turgan sonlar manfiy. Qo'shishda ishoralar bir xil bo'lsa modullar qo'shiladi, har xil bo'lsa kattasidan kichigi ayiriladi va katta sonning ishorasi qo'yiladi. Masalan (−5) + 3 da 5 − 3 = 2, ishora manfiy, javob −2. Ko'paytirishda qoida oddiy: bir xil ishoralar musbat, har xil ishoralar manfiy beradi. Shuning uchun (−4)·(−3) = 12.",
  daraja: "Daraja — bir xil ko'paytuvchini necha marta ko'paytirishni qisqa yozish usuli: 2³ = 2·2·2 = 8. Asoslari bir xil darajalar ko'paytirilsa ko'rsatkichlar qo'shiladi: 2³·2² = 2⁵. Manfiy sonni kvadratga ko'tarsak natija musbat bo'ladi, chunki ikki manfiy son ko'paytiriladi: (−3)² = 9. Lekin diqqat — qavssiz yozilgan −3² boshqa narsa, u −9 ga teng.",
  ildiz: "Kvadrat ildiz — kvadratga ko'tarishning teskari amali. √49 = 7, chunki 7² = 49. Ko'paytmadan ildiz chiqarish oson: √(16·9) = √16 · √9 = 4·3 = 12. Manfiy sondan kvadrat ildiz chiqarib bo'lmaydi, chunki hech qanday sonning kvadrati manfiy bo'lmaydi — bu qoida kvadrat tenglamalarda juda muhim bo'ladi.",
  qavs: "Qavsni ochish — qavs oldidagi ko'paytuvchini ichidagi har bir hadga ko'paytirish. Masalan 2(x + 3) = 2·x + 2·3 = 2x + 6. Agar qavs oldida minus tursa, ichidagi har bir hadning ishorasi almashadi: −(x − 5) = −x + 5. Aynan shu yerda ko'p xato qilinadi — minusni faqat birinchi hadga qo'yib, qolganini unutib qo'yish keng tarqalgan xato.",
  chiziqli: "Chiziqli tenglamani yechish — noma'lumni bir tomonga, sonlarni ikkinchi tomonga yig'ish. Masalan 2x + 4 = 10 da avval 4 ni o'ng tomonga o'tkazamiz: 2x = 6, keyin ikkala tomonni 2 ga bo'lamiz: x = 3. Hadni tenglamaning boshqa tomoniga o'tkazganda ishorasi almashishini unutmang. Javobni har doim tenglamaga qo'yib tekshirish mumkin.",

/* Model ba'zan markdown/LaTeX qaytaradi — chat oynasi oddiy matn ko'rsatgani uchun tozalaymiz */
function tozala(s){
  return String(s)
    .replace(/\$\$?([^$]+)\$\$?/g, '$1')   // $formula$
    .replace(/\*\*([^*]+)\*\*/g, '$1')     // **qalin**
    .replace(/^#{1,6}\s*/gm, '')           // ## sarlavha
    .replace(/^\s*[\*\-]\s+/gm, '• ')      // ro'yxat
    .replace(/`([^`]+)`/g, '$1')
    .trim();
}

/* AI Ustoz o'quvchining joriy holatini biladi — bilim xaritasi, zaif mavzular,
   oxirgi test natijasi va xato tahlili promptga qo'shiladi. */

  const lvl = levelOf(STATE.xp);
  const xarita = Object.keys(CONCEPTS).map(c=>{
    const i = masteryInfo(c);
    return `- ${CONCEPTS[c].nom}: ${i.jami ? `${i.togri}/${i.jami} to'g'ri (${i.yorliq})` : "hali ishlanmagan"}`;
  }).join('\n');

  const zaif = Object.keys(CONCEPTS)
    .filter(c=>{ const i=masteryInfo(c); return i.jami>0 && i.aniqlik<60; })
    .map(c=>CONCEPTS[c].nom);

  const oxirgi = STATE.results[0];
  let tahlilQatori = '';
  if (sonngiTahlil && !sonngiTahlil.toliq){
    tahlilQatori = `\nOxirgi tahlil: "${CONCEPTS[sonngiTahlil.asosiy].nom}" mavzusida xato qilgan. Sabab: ${sonngiTahlil.sabab}. Muammoning ildizi: "${CONCEPTS[sonngiTahlil.ildiz].nom}".`;
  }

  return `O'QUVCHI HAQIDA MA'LUMOT (faqat sen uchun, javobingni shunga moslashtir):
Ismi: ${STATE.user ? STATE.user.ism : "O'quvchi"} | Level ${lvl} | ${STATE.xp} XP | ${STATE.results.length} ta test ishlagan

}

async function aiUstoz(conceptKey, savol, tarix){
  const nom = CONCEPTS[conceptKey] ? CONCEPTS[conceptKey].nom : conceptKey;

  /* Foydalanuvchi o'zi savol yozdimi, yoki shunchaki "Tushuntir" tugmasini bosdimi?
     Birinchi holatda javob AYNAN savolga beriladi — mavzuga majburan bog'lanmaydi. */
  const erkinSavol = !!(savol && savol.trim() && !/^\s*(tushuntir|tushuntiring|tushuntirib bering)\s*[.!?]*\s*$/i.test(savol));

  const zaxira = erkinSavol
    ? "Hozir javob bera olmadim — internet aloqasi uzilgan ko’rinadi. Savolingizni qaytadan yuboring."
    : (FALLBACK[conceptKey] || "Bu mavzu bo’yicha tushuntirish tayyorlanmoqda.");
  if (!AI_KEY) return zaxira;

  const yoriqnoma = erkinSavol
    ? `Sen X-Edu platformasining AI Ustozisan — o’zbek tilida tushuntiruvchi universal o’qituvchi.
Foydalanuvchi ISTALGAN mavzuda savol berishi mumkin: matematika, fizika, dasturlash (HTML, CSS, JavaScript, Python), tillar, tarix va boshqalar.

ENG MUHIM QOIDA: foydalanuvchi nima so’rasa, AYNAN shu haqida javob ber.
Savolni matematikaga yoki platformadagi biror mavzuga burib yuborma.
Agar u "HTML ni o’rgat" desa — HTML haqida gapir, matematika haqida emas.

${oquvchiKonteksti()}

Yuqoridagi ma’lumot faqat foydalanuvchini tanishing uchun. Savol o’sha mavzularga
tegishli bo’lmasa — uni butunlay e’tiborsiz qoldir va statistika haqida umuman gapirma.

QOIDALAR:
- Faqat o’zbek tilida yoz.
- 4-7 ta gap, sodda til, bitta aniq misol bilan.
- Dasturlash haqida so’ralsa HAQIQIY kod yoz va teglarni to’liq ko’rsat.
  Masalan HTML uchun: <h1>Salom Dunyo</h1> — burchakli qavslarni tushirib qoldirma.
  Kodni alohida qatorga yoz, tushuntirishdan ajratib.
- Bilmaydigan narsangni o’ylab topma.
- Oddiy matn yoz: LaTeX ($ belgisi) va markdown (**, ##) ISHLATMA.
- Formulalarni oddiy yoz: x^2, D = b^2 - 4ac kabi.`
    : `Sen X-Edu platformasining AI Ustozisan — o’zbek tilida tushuntiruvchi maktab matematika o’qituvchisi (7-9-sinflar).
Foydalanuvchi "${nom}" mavzusini tanladi va tushuntirish so’radi.

${oquvchiKonteksti()}

QOIDALAR:
- Faqat o’zbek tilida yoz.
- 4-6 ta gap, sodda til, bitta aniq misol bilan.
- Yuqoridagi ma’lumotdan foydalanib javobni shu o’quvchiga moslashtir: zaif mavzusi bo’lsa tushuntirishni asosdan boshla.
- Ma’lumotni ro’yxat qilib takrorlama va "sizning statistikangizda" deb quruq gapirma — tabiiy gapir.
- Oddiy matn yoz: LaTeX ($ belgisi) va markdown (**, ##) ISHLATMA.
- Formulalarni oddiy yoz: x^2, D = b^2 - 4ac, (-3)^2 = 9 kabi.`;

  const tasdiq = erkinSavol
    ? "Tushunarli. Foydalanuvchi nima so’rasa, aynan o’sha mavzuda o’zbek tilida javob beraman."
    : `Tushunarli. ${nom} mavzusi bo’yicha o’zbek tilida tushuntiraman.`;

  // Oxirgi 6 ta xabarni kontekst sifatida uzatamiz — davomli savollar uchun
  const contents = [
    { role:'user',  parts:[{ text: yoriqnoma }] },
    { role:'model', parts:[{ text: tasdiq }] },
    ...(tarix||[]).slice(-6).map(m=>({ role: m.rol==='user'?'user':'model', parts:[{ text:m.matn }] })),
    { role:'user',  parts:[{ text: savol || "Bu mavzuni tushuntirib bering" }] }
  ];

  const ctrl = new AbortController();
  const vaqt = setTimeout(()=>ctrl.abort(), AI_TIMEOUT);
  try{
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${AI_KEY}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({ contents, generationConfig:{ temperature:0.7, maxOutputTokens:500 } })
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text = (await r.json()).candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) throw new Error('bosh javob');
    return tozala(text);
  }catch(e){
    console.warn('AI Ustoz zaxiraga o\'tdi:', e.message);
    return zaxira;
  }finally{
    clearTimeout(vaqt);
  }
}

function buildLessons(){
  const arr = []; let id = 1;
  SUBJECTS.forEach((subj, si) => {
    const topics = TOPICS[subj];
    GRADES.forEach((g) => {
      if (seedRand(si*97+g) > 0.55) return;
      const topic = topics[(si+g) % topics.length];
      const dur = 20 + (Math.floor(seedRand(id*3)*6)*5);
      const tasks = 5 + Math.floor(seedRand(id*7)*11);
      arr.push({ id: 'ls'+id, fan: subj, sinf: g, mavzu: topic, davomiylik: dur, topshiriqlar: tasks,
        views: 200 + Math.floor(seedRand(id*11)*4000) });
      id++;
    });
  });
  return arr;
}

const BULUT_MAYDONLAR = ['saved','generated','results','chats','xp','mastery','activeChat','kunlik'];

function hujjat(uid){ return FB.db.collection('oquvchilar').doc(uid); }

/* Sahifa ochilishida auth tokeni hali tarqalmagan bo'lishi yoki tarmoq uzilishi mumkin —
   shuning uchun uch marta, ortib boruvchi kechikish bilan urinamiz. */
async function bulutdanYukla(uid, urinish){
  urinish = urinish || 1;
  try{
    const snap = await hujjat(uid).get();
    if (!snap.exists) return false;
    const d = snap.data() || {};
    BULUT_MAYDONLAR.forEach(k=>{ if (d[k] !== undefined) STATE[k] = d[k]; });
    if (d.user) STATE.user = Object.assign({}, STATE.user, d.user);
    persistLocal();
    return true;
  }catch(e){
    if (urinish < 3){
      await new Promise(r=>setTimeout(r, urinish * 900));
      return bulutdanYukla(uid, urinish + 1);
    }
    console.warn("Bulutdan yuklash xatosi:", e.message, "— lokal ma'lumot bilan davom etamiz");
    return false;
  }
}

let reytingKesh = null, reytingVaqti = 0;
async function reytingOl(majburiy){
  if (!FB.ready) return { xato:'sozlanmagan' };
  if (!majburiy && reytingKesh && Date.now() - reytingVaqti < 60000) return { royxat: reytingKesh };

  /* Auth tugamagan bo'lsa so'rov navbatda osilib qoladi — avval sessiyani kutamiz */
  if (!FB.auth.currentUser){
    const kutildi = await new Promise(res=>{
      let off = null, tugadi = false;
      const yakun = (natija)=>{ if (tugadi) return; tugadi = true; clearTimeout(t); if (off) off(); res(natija); };
      const t = setTimeout(()=>yakun(false), 6000);
      /* onAuthStateChanged darhol (sinxron) chaqirilishi mumkin — shuning uchun
         off hali tayinlanmagan bo'lishi hisobga olingan */
      off = FB.auth.onAuthStateChanged(u=>{ if (u) yakun(true); });
      if (tugadi && off) off();
    });
    if (!kutildi) return { xato:'kirilmagan' };
  }

  try{
    /* Firestore ruxsat xatosida ba'zan qayta urinib osilib qoladi — 10 soniyada uzamiz */
    const snap = await Promise.race([
      FB.db.collection('reyting').orderBy('xp','desc').limit(50).get(),
      new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('Reyting so\'rovi 10 soniyada javob bermadi'),{code:'timeout'})), 10000))
    ]);
    reytingKesh = snap.docs.map(d=>Object.assign({uid:d.id}, d.data()));
    reytingVaqti = Date.now();
    return { royxat: reytingKesh };
  }catch(e){
    console.warn('Reytingni olish xatosi:', e.code, e.message);
    return { xato: (e.code === 'permission-denied' || e.code === 'timeout') ? 'ruxsat' : 'tarmoq', xabar: e.message };
  }
}

    'auth/invalid-credential': "Email yoki parol noto'g'ri.",

const LEVELS_XP = 100;
function levelOf(xp){ return Math.floor(xp / LEVELS_XP) + 1; }
function levelProgress(xp){ return xp % LEVELS_XP; }

/* =========================================================
   KUNLIK VAZIFALAR
   Har kuni yarim tunda avtomatik yangilanadi. XP bir marta beriladi —
   olingan[id] belgisi takroriy mukofotni to'xtatadi.
   ========================================================= */
const KUNLIK_VAZIFALAR = [
  { id:'test',  nom:"Bitta testni yakunlang",       maqsad:1,  xp:20, ic:"\u{1F4DD}" },
  { id:'quiz',  nom:"Tezkor quiz o'ynang",          maqsad:1,  xp:15, ic:"⚡"    },
  { id:'togri', nom:"10 ta to'g'ri javob bering",   maqsad:10, xp:25, ic:"✅"    },
  { id:'ustoz', nom:"AI Ustozga 2 ta savol bering", maqsad:2,  xp:15, ic:"\u{1F4AC}" }
];

function bugun(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function kunlikHolat(){
  if (!STATE.kunlik || STATE.kunlik.sana !== bugun()){
    STATE.kunlik = { sana: bugun(), hisob:{}, olingan:{} };
  }
  return STATE.kunlik;
}

function kunlikOshir(id, son){
  const k = kunlikHolat();
  const v = KUNLIK_VAZIFALAR.find(x=>x.id===id);
  if (!v) return;
  k.hisob[id] = (k.hisob[id]||0) + (son||1);
  if (!k.olingan[id] && k.hisob[id] >= v.maqsad){
    k.olingan[id] = true;
    STATE.xp += v.xp;
    toast("Kunlik vazifa bajarildi: " + v.nom + " — +" + v.xp + " XP");
  }
  persist();
}

function kunlikTugallangan(){ const k=kunlikHolat(); return KUNLIK_VAZIFALAR.filter(v=>k.olingan[v.id]).length; }

/* ---------- BADGE'LAR ---------- */
function badgeRoyxati(){
  const xp = STATE.xp, testlar = STATE.results.length;
  const mastered = Object.keys(CONCEPTS).filter(c=>masteryInfo(c).ozlashtirilgan).length;
  const jamiSavol = Object.values(STATE.mastery||{}).reduce((a,m)=>a+(m.jami||0),0);
  const toliq = STATE.results.filter(r=>r.foiz===100).length;
  return [
    {nom:"Birinchi qadam", tavsif:"Birinchi testni yakunlang",      got: testlar>=1,     ic:"\u{1F3AF}"},
    {nom:"100 XP",         tavsif:"100 XP to'plang",                got: xp>=100,        ic:"⭐"},
    {nom:"Mavzu egasi",    tavsif:"Bitta mavzuni 80% o'zlashtiring",got: mastered>=1,    ic:"\u{1F3C6}"},
    {nom:"Qat'iyat",       tavsif:"3 ta test yakunlang",            got: testlar>=3,     ic:"\u{1F525}"},
    {nom:"Benuqson",       tavsif:"Bitta testni 100% ishlang",      got: toliq>=1,       ic:"\u{1F48E}"},
    {nom:"Mehnatkash",     tavsif:"50 ta savolga javob bering",     got: jamiSavol>=50,  ic:"\u{1F4AA}"},
    {nom:"Bilimdon",       tavsif:"3 ta mavzuni o'zlashtiring",     got: mastered>=3,    ic:"\u{1F9E0}"},
    {nom:"Ustoz",          tavsif:"5-levelga yeting",               got: levelOf(xp)>=5, ic:"\u{1F451}"}
  ];
}
function olinganBadge(){ return badgeRoyxati().filter(b=>b.got).length; }

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast bg-navy text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-soft';
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2200);
}

  const verbLevel = { "Oson":"eslang / ayting", "O'rta":"tushuntiring", "Qiyin":"tahlil qiling va asoslang" }[daraja];
  const mathOps = ['+','-','×','÷'];
  const isMath = fan==="Matematika";
  if (turi==="Krossvord"){
    return { savol: `${idx}. "${mavzu}" mavzusiga oid ${5+idx%4} harfli atamani toping.`, javob: mavzu.split(' ')[0] };
  }
  if (turi==="Anagramma"){
    const word = mavzu.replace(/[^a-zA-Zʻʼ'A-Za-z]/g,'').slice(0, 8) || "ATAMA";
    return { savol: `${idx}. Harflarni to'g'ri tartibga solib, "${mavzu}" mavzusiga oid so'zni tiklang: ${word.split('').sort(()=>0.5-seedRand(idx*13)).join('-').toUpperCase()}`, javob: word.toUpperCase() };
  }
  if (turi==="Moslashtirish"){
    return { savol: `${idx}. "${mavzu}" mavzusidagi atamani mos ta'rifi bilan bog'lang.`, javob: "—" };
  }
  if (turi==="Bo'sh joyni to'ldirish"){
    return { savol: `${idx}. "${mavzu}" mavzusida: «... — bu ${mavzu.toLowerCase()} bilan bog'liq asosiy tushuncha hisoblanadi». Bo'sh joyni to'ldiring.`, javob: mavzu };
  }
  if (turi==="Savol-javob"){
    return { savol: `${idx}. "${mavzu}" mavzusini o'z so'zlaringiz bilan ${verbLevel}.`, javob: "Erkin javob (o'qituvchi tekshiradi)" };
  }
  if (isMath && (turi==="Test"||turi==="Nazorat ishi"||turi==="BSB"||turi==="ChSB")){
    const a = 2 + Math.floor(seedRand(idx*3+1)*18);
    const b = 2 + Math.floor(seedRand(idx*7+2)*12);
    const op = mathOps[Math.floor(seedRand(idx*5)*4)];
    let expr = `${a} ${op} ${b}`;
    const variants = [a+b, Math.max(a-b,1), a*1 + 2, a+b+1].map(v=>Math.abs(v));
    return { savol: `${idx}. ${mavzu} mavzusi bo'yicha masalani yeching: ${expr} = ?`, variantlar: [...new Set(variants)].slice(0,4), javob: null };
  }
  // umumiy test savoli
  const variants = [
    `${mavzu} ning asosiy xususiyati to'g'ri ko'rsatilgan`,
    `${mavzu} bilan bog'liq bo'lmagan holat`,
    `Qisman to'g'ri, lekin to'liq emas ta'rif`,
    `Umuman aloqasi bo'lmagan variant`
  ];
  return { savol: `${idx}. Quyidagilardan qaysi biri "${mavzu}" mavzusiga to'g'ri ta'rif beradi? (${daraja.toLowerCase()} daraja)`, variantlar: variants, javob: variants[0] };
}

const GAME_BANK = (()=>{
  const pool = [];
  SUBJECTS.forEach(s => (TOPICS[s]||[]).forEach(t => pool.push({fan:s, mavzu:t})));
  return pool;
})();

function GameModal(gameId){
  const g = GAMES.find(x=>x.id===gameId);

      <button data-action="close-modal" class="absolute right-5 top-5 w-9 h-9 rounded-full hover:bg-linesoft flex items-center justify-center"><span class="w-4 h-4">${ICONS.close}</span></button>

        <span class="w-10 h-10 rounded-xl bg-violet2-50/10 border border-[var(--violet)]/20 text-[var(--violet)] flex items-center justify-center">${icon(g.icon,'w-5 h-5')}</span>

function renderGameStart(gameId){
  return `<p class="text-sm text-inksoft mb-5">O'yinni boshlash uchun fanni tanlang.</p>
  <div class="flex flex-wrap gap-2 mb-6">
    ${SUBJECTS.map(s=>`<button data-action="game-pick-subject" data-game="${gameId}" data-fan="${s}" class="chip">${s}</button>`).join('')}
  </div>`;
}

function pickQuestions(fan, n){
  const items = GAME_BANK.filter(x=>x.fan===fan);
  const src = items.length ? items : GAME_BANK;
  const out = [];
  for(let i=0;i<n;i++){ out.push(src[Math.floor(seedRand(Date.now()%1000+i*7)*src.length)]); }
  return out;
}

let gameState = {};

function startGame(gameId, fan){
  const qs = pickQuestions(fan, 8);
  gameState = { gameId, fan, qs, idx:0, score:0 };
  renderGameBody();
}

function renderGameBody(){
  const area = document.getElementById('game-area');
  if (!area) return;
  const {gameId} = gameState;
  if (gameId==='g1') area.innerHTML = wheelGameHtml();
  else if (gameId==='g2') area.innerHTML = boxGameHtml();
  else if (gameId==='g3') area.innerHTML = wordFindHtml();
  else if (gameId==='g4') area.innerHTML = quickQuizHtml();
  else if (gameId==='g5') area.innerHTML = matchGameHtml();
  else if (gameId==='g6') area.innerHTML = anagramGameHtml();
  else if (gameId==='g7') area.innerHTML = raceGameHtml();
  else if (gameId==='g8') area.innerHTML = memoryGameHtml();
  if (gameId==='g5') initMatchGame();
  if (gameId==='g8') initMemoryGame();
  if (gameId==='g4') initQuickQuizTimer();
}

function gameScoreBar(){
  return `<div class="flex items-center justify-between mb-5 text-sm">
    <span class="text-inksoft">${gameState.fan}</span>
    <span class="font-semibold text-[var(--indigo)]">Ball: ${gameState.score}</span>
  </div>`;
}

function wheelGameHtml(){
  const colors = ['#4338CA','#7C3AED','#5B4FE0','#8B5CF6','#372DAA','#6D3BE0'];
  const seg = 360/gameState.qs.length;
  const gradient = gameState.qs.map((q,i)=>`${colors[i%colors.length]} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  return `${gameScoreBar()}
  <div class="flex flex-col items-center">
    <div class="relative w-64 h-64">
      <div id="wheel" class="w-64 h-64 rounded-full spin-wheel border-4 border-white shadow-soft" style="background: conic-gradient(${gradient});"></div>
      <div class="absolute left-1/2 -top-2 -translate-x-1/2 w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[16px] border-t-navy"></div>
    </div>
    <button data-action="spin-wheel" class="btn btn-violet px-6 py-3 mt-7">G'ildirakni aylantirish</button>
    <div id="wheel-question" class="mt-6 w-full text-center"></div>
  </div>`;
}

function boxGameHtml(){
  if (!gameState.boxes) gameState.boxes = Array.from({length:9}, (_,i)=>({opened:false, q: gameState.qs[i % gameState.qs.length], pts: 5*((i%3)+1)}));
  return `${gameScoreBar()}
  <div class="grid grid-cols-3 gap-3">
    ${gameState.boxes.map((b,i)=>`
      <button data-action="open-box" data-i="${i}" class="aspect-square rounded-2xl flex items-center justify-center text-white font-display font-bold text-lg transition-all ${b.opened? 'bg-linesoft text-inksoft border border-line':'grad-brand hover:scale-[1.03]'}">
        ${b.opened ? `<span class="text-[11px] px-2 text-center leading-tight text-ink">${b.q.mavzu}<br><span class="text-[var(--indigo)] font-bold">+${b.pts}</span></span>` : icon('box','w-7 h-7')}
      </button>`).join('')}
  </div>`;
}

function wordFindHtml(){
  if (gameState.idx>=gameState.qs.length) return gameOverHtml();
  const q = gameState.qs[gameState.idx];
  const hint = q.mavzu.replace(/[a-zA-ZʻʼA-Za-z]/g,'_').split('').join(' ');
  return `${gameScoreBar()}
  <p class="text-sm text-inksoft mb-2">Savol ${gameState.idx+1} / ${gameState.qs.length} — ${q.fan} faniga oid atamani toping:</p>
  <div class="font-display text-2xl tracking-widest text-center py-6 bg-linesoft rounded-2xl mb-5">${hint}</div>
  <form data-action="wordfind-submit" class="flex gap-2">
    <input name="answer" autocomplete="off" placeholder="Javobingizni yozing..." class="flex-1 border border-line rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--indigo)]/40"/>
    <button class="btn btn-primary px-5">Tekshirish</button>
  </form>
  <p class="text-xs text-inksoft mt-3">Maslahat: to'liq javob "${q.mavzu}" bo'lishi mumkin.</p>`;
}

function quickQuizHtml(){
  if (gameState.idx>=gameState.qs.length) return gameOverHtml();
  const q = gameState.qs[gameState.idx];
  const opts = [q.mavzu, ...GAME_BANK.filter(x=>x.mavzu!==q.mavzu).slice(0,3).map(x=>x.mavzu)].sort(()=>0.5-seedRand(gameState.idx*9));
  gameState.currentOpts = opts; gameState.currentAnswer = q.mavzu;
  return `${gameScoreBar()}
  <p class="text-sm text-inksoft mb-2">Savol ${gameState.idx+1} / ${gameState.qs.length}</p>
  <div class="flex items-center justify-between mb-4">
    <p class="font-display font-semibold">${q.fan} mavzusini aniqlang:</p>
    <span id="quiz-timer" class="text-sm font-bold text-[var(--violet)]">10</span>
  </div>
  <div class="grid sm:grid-cols-2 gap-2.5">
    ${opts.map(o=>`<button data-action="quiz-answer" data-val="${o}" class="chip text-left px-4 py-3">${o}</button>`).join('')}
  </div>`;
}
let quizTimerHandle = null;
function initQuickQuizTimer(){
  clearInterval(quizTimerHandle);
  let t = 10;
  quizTimerHandle = setInterval(()=>{
    t--;
    const el = document.getElementById('quiz-timer');
    if (el) el.textContent = t;
    if (t<=0){ clearInterval(quizTimerHandle); handleQuizAnswer(null); }
  }, 1000);
}
function handleQuizAnswer(val){
  clearInterval(quizTimerHandle);
  if (val && val===gameState.currentAnswer) { gameState.score += 10; toast("To'g'ri! +10 ball"); }
  else toast("Noto'g'ri javob");
  gameState.idx++;
  renderGameBody();
}

function matchGameHtml(){
  if (!gameState.pairs){
    const items = gameState.qs.slice(0,6);
    gameState.pairs = items;
    gameState.leftPick = null;
    gameState.matched = [];
    gameState.left = [...items].sort(()=>0.5-seedRand(1));
    gameState.right = [...items].sort(()=>0.5-seedRand(2));
  }
  return `${gameScoreBar()}
  <p class="text-sm text-inksoft mb-4">Fanni ta'rifi (mavzusi) bilan moslang.</p>
  <div class="grid grid-cols-2 gap-6">
    <div class="space-y-2" id="match-left">
      ${gameState.left.map((it,i)=>`<button data-action="match-left" data-i="${i}" class="w-full text-left chip py-2.5 ${gameState.matched.includes(it.mavzu)?'opacity-40 pointer-events-none':''} ${gameState.leftPick===i?'active':''}">${it.fan}</button>`).join('')}
    </div>
    <div class="space-y-2" id="match-right">
      ${gameState.right.map((it,i)=>`<button data-action="match-right" data-i="${i}" class="w-full text-left chip py-2.5 ${gameState.matched.includes(it.mavzu)?'opacity-40 pointer-events-none':''}">${it.mavzu}</button>`).join('')}
    </div>
  </div>
  ${gameState.matched.length===gameState.pairs.length ? `<div class="mt-6">${gameOverHtml()}</div>`:''}`;
}
function initMatchGame(){}

function anagramGameHtml(){
  if (gameState.idx>=gameState.qs.length) return gameOverHtml();
  const q = gameState.qs[gameState.idx];
  const word = q.mavzu.replace(/[^A-Za-zʻʼ ]/g,'').split(' ')[0] || 'ATAMA';
  const scrambled = word.split('').sort(()=>0.5-seedRand(gameState.idx*17)).join(' ').toUpperCase();
  gameState.currentWord = word.toUpperCase();
  return `${gameScoreBar()}
  <p class="text-sm text-inksoft mb-2">Savol ${gameState.idx+1} / ${gameState.qs.length} — ${q.fan}</p>
  <div class="font-display text-3xl tracking-[0.3em] text-center py-8 bg-linesoft rounded-2xl mb-5">${scrambled}</div>
  <form data-action="anagram-submit" class="flex gap-2">
    <input name="answer" autocomplete="off" placeholder="To'g'ri so'zni yozing..." class="flex-1 border border-line rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--indigo)]/40"/>
    <button class="btn btn-primary px-5">Tekshirish</button>
  </form>`;
}

function raceGameHtml(){
  if (!gameState.pos) gameState.pos = {me:0, bot:0};
  if (gameState.idx>=gameState.qs.length || gameState.pos.me>=100 || gameState.pos.bot>=100) return gameOverHtml();
  const q = gameState.qs[gameState.idx];
  const opts = [q.mavzu, ...GAME_BANK.filter(x=>x.mavzu!==q.mavzu).slice(0,2).map(x=>x.mavzu)].sort(()=>0.5-seedRand(gameState.idx*3));
  gameState.currentAnswer = q.mavzu;
  return `${gameScoreBar()}
  <div class="space-y-3 mb-6">
    <div>
      <div class="flex justify-between text-xs mb-1 text-inksoft"><span>Siz</span><span>${gameState.pos.me}%</span></div>
      <div class="h-3 rounded-full bg-linesoft overflow-hidden"><div class="h-full grad-brand rounded-full transition-all" style="width:${gameState.pos.me}%"></div></div>
    </div>
    <div>
      <div class="flex justify-between text-xs mb-1 text-inksoft"><span>Raqib</span><span>${gameState.pos.bot}%</span></div>
      <div class="h-3 rounded-full bg-linesoft overflow-hidden"><div class="h-full bg-inksoft/50 rounded-full transition-all" style="width:${gameState.pos.bot}%"></div></div>
    </div>
  </div>
  <p class="font-display font-semibold mb-3">${q.fan} mavzusini toping:</p>
  <div class="grid gap-2.5">${opts.map(o=>`<button data-action="race-answer" data-val="${o}" class="chip text-left px-4 py-3">${o}</button>`).join('')}</div>`;
}

function memoryGameHtml(){
  if (!gameState.cards){
    const items = gameState.qs.slice(0,6);
    let cards = [];
    items.forEach((it,i)=>{ cards.push({id:i+'a', pair:i, label:it.fan}); cards.push({id:i+'b', pair:i, label:it.fan}); });
    cards = cards.sort(()=>0.5-seedRand(3));
    gameState.cards = cards; gameState.flipped = []; gameState.matched = []; gameState.moves = 0;
  }
  return `${gameScoreBar()}
  <p class="text-sm text-inksoft mb-4">Bir xil juftlikni toping. Harakatlar: ${gameState.moves}</p>
  <div class="grid grid-cols-4 gap-2.5" id="memory-grid">
    ${gameState.cards.map((c,i)=>{
      const shown = gameState.flipped.includes(i) || gameState.matched.includes(c.pair);
      return `<button data-action="memory-flip" data-i="${i}" class="flip-card aspect-square ${gameState.matched.includes(c.pair)?'pointer-events-none':''}">
        <div class="w-full h-full rounded-xl ${shown?'bg-indigo2-50 border-2 border-[var(--indigo)]':'grad-brand'} flex items-center justify-center text-center p-1">
          <span class="text-[10px] sm:text-xs font-semibold ${shown?'text-[var(--indigo)]':'text-white'}">${shown ? c.label : ''}</span>
        </div>
      </button>`;
    }).join('')}
  </div>
  ${gameState.matched.length===6 ? `<div class="mt-6">${gameOverHtml()}</div>` : ''}`;
}
function initMemoryGame(){}

function gameOverHtml(){
  return `<div class="text-center py-6">
    <span class="w-16 h-16 rounded-full grad-brand text-white flex items-center justify-center mx-auto mb-4">${icon('trophy','w-8 h-8')}</span>

      <button data-action="close-modal" class="btn btn-primary px-5 py-2.5">Yopish</button>

let activeTest = null; // {lesson, qs, idx, answers, score}
function buildTestQuestions(lesson){
  const qs = [];
  for(let i=1;i<=8;i++){
    const q = genQuestion(lesson.fan, lesson.mavzu, "Test", "O'rta", i);
    if (!q.variantlar){
      q.variantlar = [lesson.mavzu, "Noto'g'ri variant A", "Noto'g'ri variant B", "Noto'g'ri variant C"].sort(()=>0.5-seedRand(i));
      q.javob = lesson.mavzu;
    }
    if (!q.javob) q.javob = q.variantlar[0];
    qs.push(q);
  }
  return qs;
}

/* Mavzuni "o'zlashtirilgan" deyish uchun kamida shuncha savol ishlangan bo'lishi kerak.
   Aks holda bitta to'g'ri javob 100% ko'rsatib, xato xulosa berardi. */
const MASTERY_MIN = 3;

function masteryInfo(c){
  const m = STATE.mastery[c];
  const jami = m ? m.jami : 0;
  const togri = m ? m.togri : 0;
  const aniqlik = jami ? Math.round((togri/jami)*100) : 0;
  // Chiziq "o'zlashtirishga qancha qolgani"ni ko'rsatadi: bitta to'g'ri javob
  // to'la chiziq bermaydi, chunki maxrajda kamida MASTERY_MIN turadi.
  const daraja = jami ? Math.round((togri/Math.max(jami, MASTERY_MIN))*100) : 0;

  let holat, rang, yorliq;
  if (!jami){
    holat='ishlanmagan'; rang='bg-line';  yorliq="Ishlanmagan";
  } else if (jami < MASTERY_MIN){
    holat='sinovda';     rang='bg-amber-400'; yorliq=`Dastlabki baho`;
  } else if (aniqlik >= 80){
    holat='ozlashtirilgan'; rang='bg-emerald-400'; yorliq="O'zlashtirilgan";
  } else if (aniqlik >= 50){
    holat='mashq';       rang='grad-brand'; yorliq="Mashq kerak";
  } else {
    holat='takrorlash';  rang='bg-red-400'; yorliq="Takrorlash kerak";
  }
  return { jami, togri, aniqlik, daraja, holat, rang, yorliq,
           ozlashtirilgan: holat==='ozlashtirilgan' };
}

function BilimXaritasi(){
  const ishlangan = Object.keys(CONCEPTS).filter(c=>masteryInfo(c).jami>0).length;
  return `
    ${ishlangan===0 ? `<p class="text-sm text-inksoft mb-4">Hali birorta savol ishlanmagan. Test yoki quiz ishlasangiz, har bir mavzu bo'yicha darajangiz shu yerda paydo bo'ladi.</p>` : ''}
    <div class="space-y-3.5">
    ${Object.keys(CONCEPTS).map(c=>{
      const i = masteryInfo(c);
      return `<div>
        <div class="flex justify-between items-center gap-2 text-sm mb-1.5">
          <span class="${i.jami?'':'text-inksoft'}">${CONCEPTS[c].nom}</span>
          <span class="flex items-center gap-2 shrink-0">
            ${i.jami ? `<span class="text-xs text-inksoft">${i.togri}/${i.jami} savol</span>` : ''}
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${
              i.holat==='ozlashtirilgan' ? 'bg-emerald-50 text-emerald-600' :
              i.holat==='takrorlash'     ? 'bg-red-50 text-red-600' :
              i.holat==='sinovda'        ? 'bg-amber-50 text-amber-600' :
              i.holat==='mashq'          ? 'bg-indigo2-50 text-[var(--indigo)]' :
                                           'bg-linesoft text-inksoft'}">${i.yorliq}</span>
          </span>
        </div>
        <div class="h-2 rounded-full bg-linesoft overflow-hidden">
          <div class="h-full rounded-full ${i.rang} transition-all" style="width:${i.daraja}%"></div>
        </div>
      </div>`;
    }).join('')}
    </div>
    ${ishlangan ? `<p class="text-[11px] text-inksoft mt-4 leading-relaxed">Chiziq — o'zlashtirish darajasi. Mavzu "o'zlashtirilgan" deb belgilanishi uchun kamida ${MASTERY_MIN} ta savol ishlanib, natija 80% dan yuqori bo'lishi kerak.</p>` : ''}`;

function quizTimerBoshla(){
  clearInterval(quizTimer);
  if (!quizState || quizState.tugadi) return;
  quizState.vaqt = 12;
  const bar = document.getElementById('quiz-bar');
  if (bar) requestAnimationFrame(()=>{ bar.style.transition='width 12s linear'; bar.style.width='0%'; });
  quizTimer = setInterval(()=>{
    if (!quizState || quizState.tugadi){ clearInterval(quizTimer); return; }
    quizState.vaqt--;
    const el = document.getElementById('quiz-sec');
    if (el) el.textContent = quizState.vaqt;
    if (quizState.vaqt<=0){ clearInterval(quizTimer); quizJavob(null); }
  }, 1000);
}

function quizJavob(val){
  clearInterval(quizTimer);
  if (!quizState || quizState.tugadi) return;
  const q = quizState.savollar[quizState.idx];
  const togri = val===q.javob;

  if (togri){
    quizState.togri++;
    quizState.streak++;
    quizState.engYaxshiStreak = Math.max(quizState.engYaxshiStreak, quizState.streak);
    quizState.ball += 10 + (quizState.streak>1 ? 5 : 0);
    toast(quizState.streak>1 ? `To'g'ri! +${10+5} (🔥 ${quizState.streak})` : "To'g'ri! +10");
  } else {
    quizState.streak = 0;
    toast(val===null ? `Vaqt tugadi. Javob: ${q.javob}` : `Noto'g'ri. Javob: ${q.javob}`);
  }

  const m = STATE.mastery[q.concept] || {jami:0, togri:0};
  m.jami++; if (togri) m.togri++;
  STATE.mastery[q.concept] = m;
  if (togri) kunlikOshir('togri');

  quizState.idx++;
  if (quizState.idx >= quizState.savollar.length){
    quizState.tugadi = true;
    STATE.xp += quizState.ball;
    kunlikOshir('quiz');
    STATE.results.unshift({ testId:'quiz', mavzu:"Tezkor quiz", foiz:Math.round((quizState.togri/quizState.savollar.length)*100),
                            score:quizState.togri, sana:new Date().toLocaleDateString('uz-UZ') });
    persist();
  }
  render();
}

function yangiChat(conceptKey){
  const chat = { id:'c'+Date.now()+Math.floor(Math.random()*1000),
                 concept: conceptKey || Object.keys(CONCEPTS)[0],
                 xabarlar: [], vaqt: Date.now() };
  STATE.chats.unshift(chat);
  STATE.chats = STATE.chats.slice(0,20);
  STATE.activeChat = chat.id;
  persist();
  return chat;
}
function joriyChat(){
  let c = STATE.chats.find(x=>x.id===STATE.activeChat);
  if (!c) c = STATE.chats[0] || yangiChat();
  STATE.activeChat = c.id;
  if (!CONCEPTS[c.concept]) c.concept = Object.keys(CONCEPTS)[0];
  return c;
}
function chatNomi(c){
  const birinchi = (c.xabarlar||[]).find(m=>m.rol==='user');

  return CONCEPTS[c.concept] ? CONCEPTS[c.concept].nom : 'Yangi suhbat';
}

function refreshUstozChat(){
  const el = document.getElementById('ustoz-chat');
  if (el){ el.innerHTML = UstozChat(); el.scrollTop = el.scrollHeight; }
}

async function ustozSora(savol){
  const chat = joriyChat();
  const tarix = chat.xabarlar.slice();
  chat.xabarlar.push({rol:'user', matn: savol});
  kunlikOshir('ustoz');
  ustozYuklanmoqda = true;
  refreshUstozChat();
  const javob = await aiUstoz(chat.concept, savol, tarix);
  ustozYuklanmoqda = false;
  chat.xabarlar.push({rol:'ai', matn: javob});
  persist();
  refreshUstozChat();
  // suhbat nomi birinchi savoldan kelib chiqadi — ro'yxatni yangilaymiz
  if (chat.xabarlar.filter(m=>m.rol==='user').length===1 && STATE.route==='#/ustoz') render();
}

  if (!joriyTest) return TestlarPage();

  </div>`;

function javobBer(val){
  const q = joriyTest.savollar[joriyTest.idx];
  const togri = (val === q.javob);
  joriyTest.javoblar.push({
    concept: q.concept, togri, savol:q.savol, berilgan:val, togriJavob:q.javob, izoh:q.izoh,
    vaqt: Date.now() - joriyTest.savolBoshlandi
  });

  const m = STATE.mastery[q.concept] || {jami:0, togri:0};
  m.jami++; if (togri) m.togri++;
  STATE.mastery[q.concept] = m;
  if (togri){ STATE.xp += 10; kunlikOshir('togri'); }

  joriyTest.idx++;
  joriyTest.savolBoshlandi = Date.now();

  if (joriyTest.idx >= joriyTest.savollar.length){
    sonngiTahlil = tahlilQil(joriyTest.javoblar);
    kunlikOshir('test');
    const togriSoni = joriyTest.javoblar.filter(a=>a.togri).length;
    const foiz = Math.round((togriSoni/joriyTest.javoblar.length)*100);
    STATE.results = STATE.results.filter(r=>r.testId!==joriyTest.test.id);
    STATE.results.unshift({ testId:joriyTest.test.id, mavzu:joriyTest.test.nom, foiz, score:togriSoni, sana:new Date().toLocaleDateString('uz-UZ') });
    persist();
    go('#/tahlil');
    render();
    return;
  }
  persist();
  render();
}

          <div class="flex justify-between text-sm mb-2">
            <span class="font-semibold">${xp} XP</span>
            <span class="text-inksoft">${lvl+1}-levelgacha ${LEVELS_XP-prog} XP</span>
          </div>
          <div class="h-3 rounded-full bg-linesoft overflow-hidden"><div class="h-full grad-brand rounded-full transition-all" style="width:${prog}%"></div></div>
        </div>

    <div class="grid sm:grid-cols-3 gap-4 mb-6">
      ${[["Yakunlangan testlar",testlar,'tasks'],["O'zlashtirilgan mavzular",mastered+" / "+Object.keys(CONCEPTS).length,'book'],["Jami XP",xp,'star']].map(c=>`
        <div class="card p-5">
          <span class="w-9 h-9 rounded-lg bg-indigo2-50 text-[var(--indigo)] flex items-center justify-center mb-3">${icon(c[2],'w-5 h-5')}</span>
          <div class="font-display text-2xl font-bold">${c[1]}</div>
          <div class="text-xs text-inksoft mt-1">${c[0]}</div>

    <div class="grid lg:grid-cols-2 gap-5 mb-6">
      ${KunlikVazifalar()}
      <div class="card p-6">
        <h3 class="font-display font-semibold mb-4">Bilim xaritasi</h3>
        ${BilimXaritasi()}
      </div>
    </div>

    <div class="card p-6">
      <h3 class="font-display font-semibold mb-4">Yutuqlar <span class="text-xs font-normal text-inksoft">(${olinganBadge()} / ${badges.length})</span></h3>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        ${badges.map(b=>`<div class="rounded-xl border border-line p-4 text-center ${b.got?'':'opacity-40'}">
          <div class="text-3xl mb-2">${b.ic}</div>
          <div class="text-xs font-semibold">${b.nom}</div>
          <div class="text-[10px] text-inksoft mt-1 leading-tight">${b.tavsif}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

/* =========================================================
   ROUTER
   ========================================================= */
function currentPage(){
  const r = STATE.route;
  if (r==='#/' || r==='') return HomePage();

  // ----- Student panel marshrutlari (tizimga kirish talab qilinadi) -----
  const PANEL = {
    '#/panel':   PanelDashboard,
    '#/ustoz':   UstozPage,
    '#/testlar': TestlarPage,
    '#/test':    TestPage,
    '#/quiz':    QuizPage,
    '#/tahlil':  TahlilPage,
    '#/rivoj':   RivojPage,
    '#/reyting': ReytingPage
  };
  if (PANEL[r]){
    if (!STATE.user) return RequireAuthNote();
    return PanelShell(PANEL[r]());
  }
  if (r==='#/haqimizda') return SimplePage("Biz haqimizda","X-edu — O'zbekiston o'quvchilari va o'qituvchilari uchun yaratilgan zamonaviy ta'lim platformasi. Maqsadimiz sun'iy intellekt yordamida ta'limni har bir sinfxonaga yaqinlashtirish.");
  if (r==='#/aloqa') return SimplePage("Aloqa","Savol va takliflaringiz bo'lsa, quyidagi ijtimoiy tarmoqlar orqali biz bilan bog'laning: Telegram, Instagram.");
  if (r==='#/yordam') return SimplePage("Yordam markazi","Platformadan foydalanish bo'yicha savollaringiz bo'lsa, 'Ko'p beriladigan savollar' bo'limiga murojaat qiling.");
  if (r==='#/maxfiylik') return SimplePage("Maxfiylik siyosati","Demo platforma sifatida foydalanuvchi ma'lumotlari faqat brauzeringiz xotirasida (localStorage) saqlanadi va serverga yuborilmaydi.");
  if (r==='#/shartlar') return SimplePage("Foydalanish shartlari","Ushbu sayt namoyish (demo) maqsadida yaratilgan bo'lib, ta'lim jarayonini sinov tariqasida ko'rsatadi.");
  return NotFoundPage();
}
function SimplePage(title, text){
  return `<section class="max-w-3xl mx-auto px-4 sm:px-6 py-16">
    <h1 class="font-display text-3xl font-bold mb-5">${title}</h1>
    <p class="text-inksoft leading-relaxed">${text}</p>
  </section>`;
}
function NotFoundPage(){
  return `<section class="max-w-xl mx-auto px-4 sm:px-6 py-24 text-center">
    <h1 class="font-display text-4xl font-bold">404</h1>
    <p class="text-inksoft mt-3">Sahifa topilmadi.</p>
    <a href="#/" class="btn btn-primary px-5 py-2.5 mt-6 inline-flex">Bosh sahifaga qaytish</a>
  </section>`;
}

function render(){
  document.getElementById('app').innerHTML = Header() + currentPage() + Footer();
  renderModal();
  window.scrollTo({top:0, behavior:'instant'});
  if (STATE.route==='#/quiz' && quizState && !quizState.tugadi && STATE.user) quizTimerBoshla();
  else clearInterval(quizTimer);
}
function renderModal(){
  const root = document.getElementById('modal-root');
  if (window.__modal==='auth') root.innerHTML = AuthModal();
  else if (window.__modal==='lesson') root.innerHTML = LessonModal(window.__modalData);
  else if (window.__modal==='test') { root.innerHTML = TestModal(); }
  else if (window.__modal==='game') { root.innerHTML = GameModal(window.__modalData); }
  else root.innerHTML = '';
}

document.addEventListener('keydown', (e)=>{
  if (e.key==='Escape' && window.__modal){ window.__modal=null; clearInterval(quizTimerHandle); renderModal(); }
});

window.addEventListener('hashchange', ()=>{
  STATE.route = location.hash || '#/';
  STATE.menuOpen=false;
  clearInterval(quizTimerHandle);
  window.__modal=null;
  render();
});

/* =========================================================
   EVENT DELEGATSIYA
   ========================================================= */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if (!btn) {
    // Ichki navigatsiya havolalari: hashchange hodisasiga tayanmaymiz —
    // u file:// va ba'zi muhitlarda ishga tushmaydi, sidebar shu sababli qotib qolardi.
    const link = e.target.closest('a[href^="#/"]');
    if (link){
      e.preventDefault();
      STATE.menuOpen = false;
      window.__modal = null;
      clearInterval(quizTimerHandle);
      go(link.getAttribute('href'));
      render();
      return;
    }
    if (!e.target.closest('#user-menu-wrap')) { const um = document.getElementById('user-menu'); if (um) um.classList.add('hidden'); }
    return;
  }
  const action = btn.dataset.action;

  if (action==='toggle-menu'){ STATE.menuOpen = !STATE.menuOpen; render(); }
  if (action==='toggle-user-menu'){ const um = document.getElementById('user-menu'); um.classList.toggle('hidden'); }
  if (action==='toggle-theme'){
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    DB.set('theme', next);
    render();
  }
  if (action==='open-auth'){ authMode = btn.dataset.mode; window.__modal='auth'; renderModal(); }
  if (action==='switch-auth'){ authMode = authMode==='login' ? 'register' : 'login'; renderModal(); }
  if (action==='close-modal' || (action==='close-modal-bg' && e.target===btn)){ window.__modal=null; clearInterval(quizTimerHandle); renderModal(); }
  if (action==='logout'){
    if (FB.ready) FB.auth.signOut().catch(()=>{});
    /* Keyingi foydalanuvchi oldingisining bilim xaritasini ko'rmasligi kerak */
    STATE.user=null; STATE.mastery={}; STATE.results=[]; STATE.chats=[]; STATE.activeChat=null; STATE.xp=0;
    persistLocal();
    toast("Tizimdan chiqdingiz"); go('#/'); render();
  }

  if (action==='toggle-faq'){
    const i = btn.dataset.i;
    const content = document.getElementById('faq-content-'+i);
    const chevron = btn.querySelector('.faq-chevron');
    const isOpen = content.style.maxHeight && content.style.maxHeight!=='0px';
    qsa('.accordion-content').forEach(c=>c.style.maxHeight='0px');
    qsa('.faq-chevron').forEach(c=>c.style.transform='');
    if (!isOpen){ content.style.maxHeight = content.scrollHeight+'px'; chevron.style.transform='rotate(180deg)'; }
  }

  if (action==='filter-lesson'){
    const type = btn.dataset.type, val = btn.dataset.val;
    if (type==='sinf') lessonFilters.sinf = val ? Number(val) : null;
    if (type==='fan') lessonFilters.fan = val || null;
    lessonFilters.page = 1;
    render();
  }
  if (action==='lesson-page'){ lessonFilters.page = Number(btn.dataset.p); render(); window.scrollTo({top:0}); }
  if (action==='view-lesson'){ window.__modal='lesson'; window.__modalData=btn.dataset.id; renderModal(); }
  if (action==='toggle-save'){
    const id = btn.dataset.id;
    if (!STATE.user){ toast("Saqlash uchun avval tizimga kiring"); authMode='login'; window.__modal='auth'; renderModal(); return; }
    const i = STATE.saved.indexOf(id);
    if (i>-1) STATE.saved.splice(i,1); else STATE.saved.push(id);
    persist(); render();
  }

  if (action==='chat-new'){ yangiChat(joriyChat().concept); render(); }
  if (action==='chat-open'){ STATE.activeChat = btn.dataset.id; persist(); render(); }
  if (action==='ustoz-concept'){
    const c = joriyChat();
    // Suhbat boshlangan bo'lsa mavzuni almashtirmaymiz — yangi suhbat ochamiz
    if (c.xabarlar.length) yangiChat(btn.dataset.c);
    else { c.concept = btn.dataset.c; persist(); }
    render();
  }
  if (action==='ustoz-goto'){
    yangiChat(btn.dataset.c);
    go('#/ustoz'); render();
    setTimeout(()=>ustozSora("Bu mavzuni boshidan tushuntirib bering"), 150);
  }
  if (action==='ustoz-explain'){ ustozSora("Bu mavzuni tushuntirib bering"); }

  if (action==='test-start'){ boshlaTest(btn.dataset.t); go('#/test'); render(); }
  if (action==='test-answer'){ javobBer(btn.dataset.val); }
  if (action==='test-cancel'){ joriyTest=null; go('#/testlar'); render(); }

  if (action==='reset-data'){
    STATE.xp = 0; STATE.mastery = {}; STATE.results = []; STATE.saved = [];
    STATE.chats = []; STATE.activeChat = null;
    joriyTest = null; sonngiTahlil = null; quizState = null; ustozYuklanmoqda = false;
    clearInterval(quizTimer);
    persist();
    toast("Ma'lumotlar tozalandi — toza holatdan boshlashingiz mumkin");
    go('#/panel'); render();
  }

  if (action==='reyting-yangila'){ reytingMalumot=null; reytingKesh=null; render(); reytingniYukla(); }

  if (action==='quiz-start'){ boshlaQuiz(); go('#/quiz'); render(); }
  if (action==='quiz-answer'){ quizJavob(btn.dataset.val); }

  if (action==='scroll-to'){
    STATE.menuOpen=false;
    if (STATE.route!=='#/'){ go('#/'); render(); }
    const el = document.getElementById(btn.dataset.target);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }

  if (action==='ai-level'){ aiForm.daraja = btn.dataset.val; render(); }
  if (action==='ai-count'){ aiForm.soni = Number(btn.dataset.val); render(); }
  if (action==='ai-generate'){
    const form = document.getElementById('ai-form');
    if (form){
      aiForm.fan = form.fan.value; aiForm.sinf = Number(form.sinf.value);
      aiForm.mavzu = form.mavzu.value.trim() || TOPICS[aiForm.fan][0];
      aiForm.turi = form.turi.value;
    } else if (!aiForm.mavzu) { aiForm.mavzu = TOPICS[aiForm.fan][0]; }
    aiLoading = true; aiResult = null; render();
    setTimeout(()=>{
      const savollar = Array.from({length:aiForm.soni}, (_,i)=>genQuestion(aiForm.fan, aiForm.mavzu, aiForm.turi, aiForm.daraja, i+1));
      aiResult = { ...aiForm, savollar, sana: new Date().toLocaleDateString('uz-UZ') };
      aiLoading = false;
      if (STATE.user){ STATE.generated.unshift(aiResult); STATE.generated = STATE.generated.slice(0,30); persist(); }
      render();
      document.getElementById('ai-result-wrap').scrollIntoView({behavior:'smooth', block:'start'});
    }, 1400);
  }
  if (action==='ai-edit'){ toast("Tahrirlash rejimi: matnni to'g'ridan-to'g'ri o'zgartirishingiz mumkin (demo)"); }
  if (action==='ai-save'){
    if (!STATE.user){ toast("Saqlash uchun tizimga kiring"); authMode='login'; window.__modal='auth'; renderModal(); return; }
    toast("Material profilingizga saqlandi");
  }
  if (action==='ai-print'){ window.print(); }
  if (action==='ai-pdf'){ toast("PDF sifatida saqlash uchun chop etish oynasi ochildi — 'Saqlash' manzilida PDF ni tanlang"); setTimeout(()=>window.print(), 300); }

  if (action==='open-game'){ window.__modal='game'; window.__modalData=btn.dataset.id; renderModal(); }
  if (action==='game-pick-subject'){ startGame(btn.dataset.game, btn.dataset.fan); }
  if (action==='spin-wheel'){
    const wheel = document.getElementById('wheel');
    const idx = Math.floor(seedRand(Date.now())*gameState.qs.length);
    const seg = 360/gameState.qs.length;
    const target = 360*4 + (360 - (idx*seg + seg/2));
    wheel.style.transform = `rotate(${target}deg)`;
    setTimeout(()=>{
      const q = gameState.qs[idx];
      gameState.score += 10;
      document.getElementById('wheel-question').innerHTML = `<div class="card p-4"><p class="text-sm font-semibold">${q.fan}: ${q.mavzu}</p><p class="text-xs text-inksoft mt-1">+10 ball qo'lga kiritdingiz!</p></div>` + gameScoreBar();
    }, 4600);
  }
  if (action==='open-box'){
    const i = Number(btn.dataset.i);
    if (gameState.boxes[i].opened) return;
    gameState.boxes[i].opened = true;
    gameState.score += gameState.boxes[i].pts;
    renderGameBody();
  }
  if (action==='quiz-answer'){ handleQuizAnswer(btn.dataset.val); }
  if (action==='match-left'){ gameState.leftPick = Number(btn.dataset.i); renderGameBody(); }
  if (action==='match-right'){
    if (gameState.leftPick===null || gameState.leftPick===undefined) return;
    const l = gameState.left[gameState.leftPick]; const r = gameState.right[Number(btn.dataset.i)];
    if (l.mavzu===r.mavzu){ gameState.matched.push(l.mavzu); gameState.score += 15; toast("To'g'ri juftlik! +15"); }
    else toast("Mos kelmadi, qayta urinib ko'ring");
    gameState.leftPick = null;
    renderGameBody();
  }
  if (action==='race-answer'){
    const correct = btn.dataset.val===gameState.currentAnswer;
    if (correct){ gameState.pos.me = Math.min(100, gameState.pos.me+20); gameState.score+=10; } 
    gameState.pos.bot = Math.min(100, gameState.pos.bot + 12);
    gameState.idx++;
    renderGameBody();
  }
  if (action==='memory-flip'){
    const i = Number(btn.dataset.i);
    if (gameState.flipped.includes(i) || gameState.flipped.length>=2) return;
    gameState.flipped.push(i); gameState.moves++;
    renderGameBody();
    if (gameState.flipped.length===2){
      const [a,b] = gameState.flipped;
      const ca = gameState.cards[a], cb = gameState.cards[b];
      setTimeout(()=>{
        if (ca.pair===cb.pair && a!==b){ gameState.matched.push(ca.pair); gameState.score+=10; }
        gameState.flipped = [];
        renderGameBody();
      }, 700);
    }
  }

  if (action==='lib-filter'){ libFilters.turi = btn.dataset.val || null; render(); }

  if (action==='start-test'){
    const l = LESSONS.find(x=>x.id===btn.dataset.id);
    activeTest = { lesson:l, qs: buildTestQuestions(l), idx:0, score:0 };
    window.__modal='test'; renderModal();
  }
  if (action==='answer-test'){
    const q = activeTest.qs[activeTest.idx];
    if (btn.dataset.val===q.javob) activeTest.score++;
    activeTest.idx++;
    if (activeTest.idx>=activeTest.qs.length && STATE.user){
      const foiz = Math.round((activeTest.score/activeTest.qs.length)*100);
      STATE.results.unshift({mavzu:activeTest.lesson.mavzu, foiz, score:foiz, sana:new Date().toLocaleDateString('uz-UZ')});
      persist();
    }
    renderModal();
  }
  if (action==='retry-test'){ activeTest = { lesson:activeTest.lesson, qs: buildTestQuestions(activeTest.lesson), idx:0, score:0 }; renderModal(); }

  if (action==='choose-plan'){
    if (!STATE.user){ toast("Tarifni tanlash uchun avval ro'yxatdan o'ting"); authMode='register'; window.__modal='auth'; renderModal(); return; }
    toast(`"${btn.dataset.plan}" tarifi tanlandi (demo)`);
  }
  if (action==='billing'){ STATE.billing = btn.dataset.val; render(); }
});

document.addEventListener('change', (e)=>{
  const el = e.target.closest('[data-action="lib-select"]');
  if (el){ libFilters[el.dataset.type] = el.value || null; if (el.dataset.type==='sinf' && el.value) libFilters.sinf = Number(el.value); render(); }

document.addEventListener('submit', (e)=>{
  const form = e.target.closest('[data-action]');
  if (!form) return;
  e.preventDefault();
  const action = form.dataset.action;
  if (action==='ustoz-send'){
    const savol = form.savol.value.trim();
    if (!savol) return;
    form.savol.value = '';
    ustozSora(savol);
  }
  if (action==='auth-form' || form.id==='auth-form'){
    // handled below via id check
  }
  if (action==='wordfind-submit'){
    const val = form.answer.value.trim().toLowerCase();
    const q = gameState.qs[gameState.idx];
    if (val===q.mavzu.toLowerCase()){ gameState.score+=15; toast("To'g'ri! +15 ball"); }
    else toast(`Noto'g'ri. Javob: ${q.mavzu}`);
    gameState.idx++;
    renderGameBody();
  }
  if (action==='anagram-submit'){
    const val = form.answer.value.trim().toUpperCase();
    if (val===gameState.currentWord){ gameState.score+=15; toast("To'g'ri! +15 ball"); }
    else toast(`Noto'g'ri. Javob: ${gameState.currentWord}`);
    gameState.idx++;
    renderGameBody();
  }
});
document.getElementById('modal-root').addEventListener('submit', async (e)=>{
  if (e.target.id !== 'auth-form') return;
  e.preventDefault();
  const f = e.target;
  const royxat = !!f.ism;                       // ism maydoni faqat ro'yxatdan o'tishda bor
  const ism = royxat ? f.ism.value.trim() : f.email.value.split('@')[0];
  const sinf = f.sinf ? Number(f.sinf.value) : (STATE.user && STATE.user.sinf) || 8;
  const email = f.email.value.trim();
  const parol = f.parol.value;

  const tugma = f.querySelector('button');
  const asliy = tugma ? tugma.innerHTML : '';

  /* Firebase sozlanmagan bo'lsa — eski lokal xulq saqlanadi */
  if (!FB.ready){
    STATE.user = { ism: ism || "O'quvchi", email, rol:'oquvchi', sinf };
    persist();
    window.__modal = null;
    toast(`Xush kelibsiz, ${STATE.user.ism}!`);
    renderModal(); go('#/panel'); render();
    return;
  }

  if (tugma){ tugma.disabled = true; tugma.innerHTML = royxat ? 'Yaratilmoqda…' : 'Kirilmoqda…'; }
  try{
    const natija = royxat
      ? await FB.auth.createUserWithEmailAndPassword(email, parol)
      : await FB.auth.signInWithEmailAndPassword(email, parol);
    const u = natija.user;

    if (royxat && ism) { try{ await u.updateProfile({ displayName: ism }); }catch(_){} }

    STATE.user = { uid: u.uid, ism: ism || "O'quvchi", email, rol:'oquvchi', sinf };
    if (!royxat) await bulutdanYukla(u.uid);     // mavjud foydalanuvchi — bilim xaritasi bulutdan keladi
    persist();

    window.__modal = null;
    toast(royxat ? `Hisob yaratildi, ${STATE.user.ism}!` : `Xush kelibsiz, ${STATE.user.ism}!`);
    renderModal(); go('#/panel'); render();
  }catch(err){
    console.warn('Auth xatosi:', err.code, err.message);
    toast(bulutXatosi(err.code));
    if (tugma){ tugma.disabled = false; tugma.innerHTML = asliy; }
  }
});

   true  -> sahifa ochilishi bilan avtomatik kirilgan holatda bo'ladi (login shart emas)
   false -> odatdagi holat: mehmon bosh sahifada qoladi, panelga kirish uchun

const TEZ_SINOV = false;

/* Firebase ulangan bo'lsa haqiqiy sessiya ustun turadi — soxta foydalanuvchi yaratilmaydi */
if (TEZ_SINOV && !STATE.user && !FB.ready){
  STATE.user = { ism:"Aziza Karimova", email:"aziza@uni.uz", rol:'oquvchi' };
}

/* Sahifa yangilanganda sessiya tiklanadi va bilim xaritasi bulutdan yuklanadi */
if (FB.ready){
  FB.auth.onAuthStateChanged(async (u)=>{
    if (!u){ return; }
    const boshqaOdam = STATE.user && STATE.user.uid && STATE.user.uid !== u.uid;
    if (boshqaOdam){
      /* Hisob almashdi — oldingi o'quvchining o'rganish ma'lumoti tashlanadi */
      STATE.mastery = {}; STATE.results = []; STATE.chats = []; STATE.activeChat = null;
      STATE.xp = 0; STATE.kunlik = null; STATE.user = null;
    }
    STATE.user = Object.assign(
      { ism: u.displayName || (u.email||'').split('@')[0] || "O'quvchi", rol:'oquvchi', sinf:8 },
      STATE.user || {},
      { uid: u.uid, email: u.email }
    );
    const bor = await bulutdanYukla(u.uid);
    if (bor) reytinggaYoz();   // faqat bulutda haqiqiy profili bo'lsa reytingni yangilaymiz
    render();
  });
}
